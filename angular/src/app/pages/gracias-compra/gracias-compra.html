<main class="mx-auto flex min-h-[65vh] w-full max-w-3xl items-center justify-center px-5 py-16">
  <section class="w-full rounded-3xl border border-[#eee3da] bg-white p-8 text-center shadow-sm sm:p-12">
    <div class="mx-auto grid h-20 w-20 place-items-center rounded-full bg-[#eef7ed] text-4xl text-[#71966b]">✓</div>
    <p class="mt-7 text-xs font-semibold uppercase tracking-[.2em] text-[#b88968]">BUBBLECOOKIES</p>
    <h1 class="mt-3 text-3xl font-bold text-[#76543e]">¡Gracias por tu compra!</h1>
    <p class="mx-auto mt-3 max-w-lg text-sm leading-7 text-[#a1816b]">Tu pedido se registró correctamente. Estamos preparando algo delicioso para ti.</p>
    <p *ngIf="codigo" class="mt-6 inline-flex rounded-xl bg-[#fcf6ef] px-5 py-3 text-sm font-semibold text-[#805d49]">Número de pedido: {{codigo}}</p>
    <div><a routerLink="/catalogo" class="mt-8 inline-flex rounded-xl bg-[#86bce7] px-6 py-3 text-sm font-bold text-white hover:bg-[#6da9da]">Volver al catálogo</a></div>
  </section>
</main>
